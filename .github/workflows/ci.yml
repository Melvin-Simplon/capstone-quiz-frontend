# The CI entry point. Holds no steps of its own: it exists so that the three
# checks below finish as one named workflow, which is what cd.yml waits on.
#
# Three separate workflows would each end on their own, and workflow_run fires
# per workflow, so the deployment would start after whichever finished first.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/ci-lint.yml

  format:
    uses: ./.github/workflows/ci-format.yml

  security:
    uses: ./.github/workflows/ci-security.yml

  sast:
    # A called workflow cannot hold more than its caller grants it, so the
    # right to write findings to the Security tab is granted here.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-codeql.yml

  quality:
    # secrets: inherit would hand the called workflow every secret this
    # repository holds. It needs one.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: ./.github/workflows/ci-sonar.yml
