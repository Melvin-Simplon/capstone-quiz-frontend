# Accessibility. Not security, but the same idea: a gate on every pull request.
#
# Called from ci.yml.
name: Accessibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-app

      - name: Build
        run: npm run build

      - name: Scan the built site
        run: scripts/workflows/ci/check-accessibility.sh

      - name: Keep the axe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-report
          path: axe-results.json
          if-no-files-found: ignore
