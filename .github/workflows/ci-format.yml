# Prettier.
#
# Called from ci.yml.
name: Format

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-app

      - name: Prettier
        run: npm run format:check
