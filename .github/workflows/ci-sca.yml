# Software composition analysis: known CVEs in the dependencies.
#
# Called from ci.yml.
name: SCA

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scan the dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
