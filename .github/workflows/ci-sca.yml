# Software composition analysis: known CVEs in the dependencies.
#
# Called from ci.yml.
name: SCA

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Trivy answers "do the dependencies we have carry known CVEs". This answers
  # "does this pull request add one", which a scan of the current lockfile
  # cannot: a vulnerable package already present makes both look the same.
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  sca:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scan the dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
