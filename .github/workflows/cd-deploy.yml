# Ships what lands on main: the reference analyses, then the site, then a DAST
# scan of what was shipped.
#
# The build and security checks already gated the merge on the pull request,
# so main only runs what needs the merged code: SonarCloud and CodeQL keep
# their reference, which the next pull requests are compared against.
#
# A dispatch, which is how the Makefile in the infrastructure repository gets
# here, skips those two: it asks for a deployment of what main already holds.
#
# Every deploy step calls a script under scripts/workflows/deploy. Nothing but
# the wiring lives here, so each piece can be read, run and debugged on its own.
name: CD - Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    # secrets: inherit would hand the called workflow every secret this
    # repository holds. It needs one.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: ./.github/workflows/ci-build.yml
    with:
      reference_only: true

  security:
    if: github.event_name == 'push'
    # A called workflow cannot hold more than its caller grants. CodeQL writes
    # to the Security tab; pull-requests is declared by dependency-review, which
    # does not run here but is checked against this grant all the same.
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    uses: ./.github/workflows/ci-security.yml
    with:
      reference_only: true

  # Whether there is anything to deploy to, asked before the deployment rather
  # than inside it. The environment is built and torn down between sessions, so
  # an absent one is a normal state: there is nothing to deploy, which is not a
  # deployment that failed. Answering no here leaves deploy skipped rather than
  # red, and leaves the reviewer on nonprod to be asked only about a deployment
  # that can actually happen.
  #
  # build and security are skipped on a dispatch, and a skipped need skips this
  # job too unless the condition says otherwise. A failed one still stops it.
  target:
    needs: [build, security]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      found: ${{ steps.look.outputs.found }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # No client secret: the workflow proves which repository and branch it
      # runs from, and Azure hands back a token that dies with the job. No
      # environment: on this job, so that the gate on nonprod is reached only
      # once there is something to gate. The Azure ids are repository variables,
      # and refs/heads/main is a trusted subject of its own.
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Is the environment built
        id: look
        run: scripts/workflows/deploy/is-the-environment-built.sh

  # Builds the site with the values it can only know at deploy time, uploads it,
  # and checks that it answers and that the backend answers it.
  deploy:
    name: Static Web Apps
    needs: target
    # Skipped, not failed, when the environment is not built.
    if: ${{ !cancelled() && needs.target.outputs.found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nonprod
    outputs:
      site_url: ${{ steps.site.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-app

      # No client secret: the workflow proves which repository, branch and
      # environment it runs from, and Azure hands back a token that dies with
      # the job.
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the backend and the site
        id: target
        run: scripts/workflows/deploy/find-targets.sh

      - name: Read the API key
        id: key
        env:
          VAULT: ${{ steps.target.outputs.vault }}
        run: scripts/workflows/deploy/read-api-key.sh

      - name: Close the vault again
        if: always() && steps.key.outputs.runner_ip != ''
        env:
          VAULT: ${{ steps.target.outputs.vault }}
          RUNNER_IP: ${{ steps.key.outputs.runner_ip }}
        run: scripts/workflows/deploy/close-the-vault.sh

      - name: Point the build at the backend
        env:
          API_URL: ${{ steps.target.outputs.api_url }}
          API_KEY: ${{ steps.key.outputs.value }}
          BACKEND_ORIGIN: ${{ steps.target.outputs.backend_origin }}
        run: python3 scripts/workflows/deploy/point-the-build-at-the-backend.py

      - name: Build
        run: npm run build:prod

      - name: Check the build against the policy
        run: python3 scripts/workflows/deploy/check-the-build-against-the-policy.py

      - name: Read the deployment token
        id: swa
        env:
          SITE: ${{ steps.target.outputs.site }}
          GROUP: ${{ steps.target.outputs.group }}
        run: scripts/workflows/deploy/read-deployment-token.sh

      - name: Upload the site
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: dist/azure-quiz-frontend/browser
          skip_app_build: true
          skip_api_build: true

      - name: Check the site and the path to the backend
        id: site
        env:
          SITE: ${{ steps.target.outputs.site }}
          GROUP: ${{ steps.target.outputs.group }}
          API_URL: ${{ steps.target.outputs.api_url }}
          API_KEY: ${{ steps.key.outputs.value }}
        run: scripts/workflows/deploy/check-the-site.sh

  # Separate job: a failure here means the deployment is wrong, not the upload.
  dast:
    needs: deploy
    uses: ./.github/workflows/cd-dast.yml
    with:
      site_url: ${{ needs.deploy.outputs.site_url }}
