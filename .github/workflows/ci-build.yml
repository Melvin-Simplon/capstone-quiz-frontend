# Everything that says whether the module builds and holds together: lint,
# format, tests with the SonarCloud analysis, accessibility, production build.
#
# Runs on every pull request, which is where these checks gate a merge. main
# does not run it again on push: cd-deploy.yml calls it with reference_only,
# which keeps only the SonarCloud analysis, the reference pull requests are
# compared against.
name: CI - Build module

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      reference_only:
        description: Run only the analysis main keeps as a reference for pull requests.
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: true
  # Runnable on its own while working on it, without opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

# A literal group: github.workflow names the caller when this file is called,
# and sharing the caller's group would leave each run waiting on the other.
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint (ESLint)
    if: ${{ !inputs.reference_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-app

      - name: ESLint
        run: npm run lint

  format:
    name: Format (Prettier)
    if: ${{ !inputs.reference_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-app

      - name: Prettier
        run: npm run format:check

  # The tests run here rather than in a job of their own: coverage is a file on
  # disk, and nothing carries it between two jobs without an artifact.
  quality:
    name: Tests and quality (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: Sonar dates an issue from the commit that introduced it,
      # and a shallow clone leaves it nothing to read, so everything lands in
      # New Code and the quality gate judges the whole repository as new.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-app

      # github-actions puts a failure on the diff at the line that failed;
      # default keeps the table in the log; json feeds the summary below.
      - name: Test with coverage
        run: >
          npm run test:coverage --
          --reporters=json --reporters=default --reporters=github-actions
          --output-file=test-results.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The policy check is a security gate of its own, so it is tested like
      # one. Its coverage goes to Sonar next to the Angular one.
      #
      # Same care as npm ci --ignore-scripts: every package locked by hash, and
      # wheels only, so no setup.py runs with the job's credentials.
      - name: Test the workflow scripts
        run: |
          pip install --quiet --require-hashes --only-binary :all: \
            -r scripts/workflows/tests/requirements.txt
          python -m pytest scripts/workflows/tests -p no:cacheprovider \
            --cov=scripts/workflows/deploy --cov-report=xml:coverage/python/coverage.xml

      - name: Put the tests and the coverage on the summary page
        if: always()
        env:
          PULL_REQUEST: ${{ github.event.number }}
        run: scripts/workflows/ci/summarise-the-quality-report.sh

      # Dependabot runs are handed a separate, empty secret store, so SONAR_TOKEN
      # arrives blank and the scanner answers "Not authorized" on a branch that
      # only ever touches package-lock.json. The tests above still run, and the
      # branch is scanned for real once it lands on a long-lived branch.
      #
      # The step is skipped rather than the job: this job is a required check,
      # and a skipped job would leave every Dependabot pull request waiting.
      - name: Analyse
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Not security, but the same idea: a gate on every pull request.
  a11y:
    name: Accessibility (axe-core)
    if: ${{ !inputs.reference_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-app

      - name: Build
        run: npm run build

      - name: Scan the built site
        run: scripts/workflows/ci/check-accessibility.sh

      - name: Keep the axe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-report
          path: axe-results.json
          if-no-files-found: ignore

  # The configuration cd-deploy.yml ships, built with the placeholders still in
  # place: its budgets and its optimiser fail here rather than on the way to
  # Azure. The deployment builds again, once the backend url is known.
  build:
    name: Build (production)
    if: ${{ !inputs.reference_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-app

      - name: Build
        run: npm run build:prod
