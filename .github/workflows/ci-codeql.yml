# CodeQL static analysis.
#
# Called from ci.yml. GitHub Actions cannot nest workflow files in folders,
# so the ci- and cd- prefixes stand in for the two directories this would
# otherwise live in.
name: ci-codeql

on:
  workflow_call:
  # Runnable on its own while working on it, without opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
