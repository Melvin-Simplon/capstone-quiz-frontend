name: CI - Security scan

on:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '23 5 * * *'
  workflow_call:
    inputs:
      reference_only:
        description: Run only the analysis main keeps as a reference for pull requests.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    name: Secrets (gitleaks and Trivy)
    if: ${{ !inputs.reference_only && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: scripts/workflows/security/scan-history-for-secrets.sh

      - name: Scan the working tree for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"

  sca:
    name: SCA (npm audit and Trivy)
    if: ${{ !inputs.reference_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-app
        with:
          install: 'false'

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  review:
    name: SCA (dependency-review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  sast:
    name: SAST (CodeQL)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
