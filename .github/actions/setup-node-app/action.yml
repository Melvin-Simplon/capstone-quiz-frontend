name: Set up Node and install
description: Reads the Node version from .nvmrc, restores the npm cache and installs the locked dependencies.

inputs:
  install:
    description: Set to false to configure Node without installing anything.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - if: inputs.install == 'true'
      shell: bash
      run: npm ci --ignore-scripts
