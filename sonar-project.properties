# Read by the scanner in ci-build.yml. Automatic Analysis ignores most of this
# file, so switching back to it silently drops coverage and the exclusions.

sonar.projectKey=Melvin-Simplon_capstone-quiz-frontend
sonar.organization=melvin-at-simplon-co-quiz-bilan-01

# The whole repository, not just src: the workflows, the shell scripts and the
# Python under scripts/ are where every security issue found so far lived.
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,coverage/**,.angular/**,**/*.spec.ts,scripts/workflows/tests/**

# Spec files are excluded from sources above so that they are indexed once,
# as tests. Indexing a file twice fails the analysis.
sonar.tests=src,scripts/workflows/tests
sonar.test.inclusions=**/*.spec.ts,**/test_*.py

# Written by `npm run test:coverage`. The project name in the path comes from
# angular.json, not from the repository name.
sonar.javascript.lcov.reportPaths=coverage/azure-quiz-frontend/lcov.info
sonar.python.coverage.reportPaths=coverage/python/coverage.xml

# Glue between the workflow steps: still analysed for bugs and vulnerabilities,
# only left out of the coverage figure. The policy check is not in this list,
# it is a security gate and its tests are what prove it still refuses.
sonar.coverage.exclusions=scripts/workflows/lib.py,scripts/workflows/deploy/point-the-build-at-the-backend.py
